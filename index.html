else if(c!=='S'&&Math.random()<.07){const a=PL[fo];fight(E[a[R(0,a.length-1)]])}}
function ask(){st='t';say(loop?'ピコン。コメントが届いている。\n「タバコ？」 私はmoon。\n「あんた、タバコでしょ。」':'ピコン。コメントが届いている。\n「あんた、タバコでしょ。ビスコって何？」','#8ff')}
function first(){ci=0;while(P[ci].h<=0)ci++}
function fight(e){const m=e.boss?1:1+.4*fo;e={...e,h:Math.round(e.h*m),a:e.boss?e.a:[Math.round(e.a[0]*m),Math.round(e.a[1]*m)]};en={...e,stk:[],ax:70,ay:35,s:[...Array(e.k)].map(()=>{const a=Math.random()*6.28,r=Math.random()*45;return{x:Math.cos(a)*r,y:Math.sin(a)*r*1.1,r:e.boss?20:24,on:0}})};st='c';say(`${en.n}が現れた！`,'#fd5');first()}
function act(k){if(st!=='c')return;const p=P[ci];let d;
if(k===0){st='a';say(`${p.n}：ドラッグでねらい、離して言葉を放て！`);ui();return}
else if(k===1){if(!p.sp)return;if(p.m<1){say('MPが足りない。');return}p.m--;
if(p.sp==='ワン'){const t=P.filter(q=>q.h>0).sort((a,b)=>a.h/a.H-b.h/b.H)[0],v=R(10,16);t.h=Math.min(t.H,t.h+v);say(`${p.n}「ワン！」 ${t.n}のHPが${v}回復。`,'#8ff')}
else{en.fr=3;en.ft=performance.now()/1000;say(`${p.n}「私はポチ」 敵の動きが止まった。`,'#8ff')}}
else if(k===2){p.g=1;say(`${p.n}は身を守った。`)}
else if(k===3){if(Math.random()<(en.boss?.3:.5)){say('なんとか逃げ出した。');if(en.boss){x=ox;y=oy}end();return}say('逃げられない！')}
if(en.h<=0){win();return}next()}
function next(){do ci++;while(ci<3&&P[ci].h<=0);if(ci>2){foe();if(st==='o')return;first()}ui()}
function fire(c){st='f';fl={sx:240,sy:340,tx:c.x,ty:c.y,t0:performance.now()};ui();setTimeout(()=>{fl=null;const p=P[ci],[px,py]=epos();let d=0;
const s=en.s.find(s=>Math.hypot(c.x-px-s.x,c.y-py-s.y)<s.r);
if(s){d=s.on?R(8,10):R(14,20);s.on=1;say(`${p.n}の言葉が、ぽんっ！ (${d})`,'#fd5')}
else if(((c.x-px)/80)**2+((c.y-py)/90)**2<1){d=R(3,5);en.stk.push({x:c.x-px,y:c.y-py});say(`言葉が届いた。(${d})`)}
else say('言葉は届かなかった。');
st='c';if(en.fr>0)en.fr--;en.h-=d;if(en.h<=0){win();return}next()},230)}
const pt=e=>{const r=$('v').getBoundingClientRect();return{x:(e.clientX-r.left)*480/r.width,y:(e.clientY-r.top)*360/r.height}};
$('v').onpointerdown=e=>{if(st!=='a')return;aim=1;cur=pt(e);$('v').setPointerCapture(e.pointerId)};
$('v').onpointermove=e=>{if(aim)cur=pt(e)};
$('v').onpointerup=()=>{if(st==='e'&&cl!==null&&!sk){sk=performance.now()/1000;ui();return}if(!aim||st!=='a')return;aim=0;fire(cur)};
setInterval(draw,33);
function foe(){const t=P.filter(q=>q.h>0),q=t[R(0,t.length-1)];let d=R(...en.a);if(q.g)d=Math.ceil(d/2);P.forEach(p=>p.g=0);
if(en.t&&(en.al||Math.random()<.5))say(`${en.n}「${en.t}」`,'#f66');
q.h-=d;say(`${en.n}の攻撃！ ${q.n}は${d}ダメージ。`);if(q.h<=0){q.h=0;say(`${q.n}は倒れた……`,'#f66')}
if(!P.some(p=>p.h>0)){st='o';say('全滅した。誰も訪ねてこない廃墟に、君たちは残された。\n(to coda)','#f66');ui()}}
function win(){const gl=en.id==='girl';say(`${en.n}を倒した！ (経験値${en.xp})`,'#fd5');xp+=en.xp;
if(en.id==='monk'){bd.gate=1;say('宇宙暗黒大僧正様「一瞬は永遠を孕む、、、ということか、、、」\n道が開けた。','#8ff')}
if(en.id==='pochi'){bd.gate=1;say('真実のポチ「お前だったか、、ワン、、」\n道が開けた。','#8ff')}
if(gl){bd.girl=1;say('彼女は、画面の向こうへ引いていった。','#8ff')}
const nl=1+Math.floor(xp/18);while(lv<nl){lv++;P.forEach(p=>{p.H+=5;p.h=p.H;if(p.M){p.M++;p.m=p.M}});say(`レベル${lv}に上がった！`,'#8ff')}end();if(gl){ask();ui()}}
function end(){st='x';en=null;ui()}
function pw(i){const o=PW[loop][i];
if(loop===0&&i===0){say(o[1],'#f66');loop=1;fo=0;M=FL[0];x=1;y=1;f=2;seen={'0:1,1':1};items={};bd={};P.forEach(p=>{p.h=p.H;if(p.M)p.m=p.M});say('アカウント「moon」を登録した。\n(dal segno)','#8ff');st='x';ui();return}
if(loop===1&&i===2){st='e';cl=performance.now()/1000;say('—君は誰。','#8ff');ui();sk=0;return}
say(o[1],'#f66')}
addEventListener('keydown',e=>{const k=e.key;if(st==='x'){const m={ArrowUp:'F',ArrowLeft:'L',ArrowRight:'R',ArrowDown:'B',w:'F',a:'L',d:'R',s:'B'}[k];if(m){e.preventDefault();mv(m)}}else if(st==='c'&&'1234'.includes(k)&&k)act(k-1)});
ui();
